###############################################################################
# Full-stack development: React app + API (built locally) + DB + Redis
# Drop this file in your React project root alongside the API folder.
#
# Usage:
#   docker compose -f docker-compose.react.yml up --build
#
# Requirements:
#   - This file must sit one level above the `inveno-api/` folder  OR
#     adjust the `context` path below to point to your API source.
###############################################################################
name: inveno-fullstack

services:

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./inveno-api          # ← path to the Django API project root
      dockerfile: docker/api/Dockerfile
    env_file: ./inveno-api/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── React App ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .                     # ← your React project root
      dockerfile: Dockerfile         # ← your React Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000   # or REACT_APP_API_URL
    depends_on:
      - api
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inveno
      POSTGRES_USER: inveno
      POSTGRES_PASSWORD: inveno
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inveno"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
