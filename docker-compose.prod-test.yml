###############################################################################
# Production image local smoke-test
# Mirrors Railway environment — no db/redis containers (use external URLs)
# Usage: docker compose -f docker-compose.prod-test.yml up --build
###############################################################################
name: inveno-prod-test

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.prod
    env_file: .env.prod-test     # Copy .env.example → .env.prod-test and fill in real values
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      PORT: "8000"
