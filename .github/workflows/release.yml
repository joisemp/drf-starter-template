###############################################################################
# Release workflow
# Triggered ONLY when a GitHub Release is published (e.g. v1.2.0).
# 1. Builds the production Docker image (multi-stage)
# 2. Pushes versioned + latest tags to GitHub Container Registry (GHCR)
# 3. Triggers Railway deploy webhook to redeploy with the new image
###############################################################################
name: Release — Build, Push & Deploy

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. your-org/inveno-api

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semver tag from the GitHub Release (e.g. v1.2.0 → 1.2.0)
            type=semver,pattern={{version}}
            # Always update the `latest` tag
            type=raw,value=latest

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-railway:
    name: Trigger Railway Redeploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger Railway deploy webhook
        run: |
          curl -s -X POST "${{ secrets.RAILWAY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail \
            --retry 3 \
            --retry-delay 5
          echo "Railway deploy webhook triggered."
